# Onboarding docs build and deploy.
#
# The Docusaurus source lives at `onboarding/` on the `onboarding`
# branch. This workflow builds the static site and publishes it to
# GitHub Pages using the official Pages deployment actions
# (`upload-pages-artifact` + `deploy-pages`). Nothing rendered is
# committed back to the branch, and Jekyll is bypassed entirely.
#
# Pages must be configured to deploy from GitHub Actions:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# This is set as `build_type: workflow` on the repository's Pages config.

name: Onboarding docs

on:
  push:
    branches: [onboarding]
    paths:
      - "onboarding/**"
      - ".github/workflows/onboarding-docs.yml"
  workflow_dispatch:

# Allow the workflow to deploy to GitHub Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deployment; do not cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: onboarding/package-lock.json

      - name: Install dependencies
        working-directory: onboarding
        run: npm ci

      - name: Build site
        working-directory: onboarding
        run: npx docusaurus build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: onboarding/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
